[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-test-case-generator"
version = "0.3.0"
description = "AI-powered test case generator - Generate comprehensive test cases from requirements using GPT-4"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Kamran Ghaffar", email = "kamranghafar@gmail.com"},
]
keywords = ["ai", "testing", "test-cases", "qa", "test-automation", "openai", "gpt4"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "openai>=1.12.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.scripts]
ai-testgen = "ai_test_case_generator.cli:cli"

[project.urls]
Homepage = "https://github.com/kamranghafar/ai-test-case-generator"
Documentation = "https://github.com/kamranghafar/ai-test-case-generator#readme"
Repository = "https://github.com/kamranghafar/ai-test-case-generator"
Issues = "https://github.com/kamranghafar/ai-test-case-generator/issues"

[tool.setuptools.packages.find]
include = ["ai_test_case_generator*"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
